<style>

e-between;align-items:center;gap:16px;margin-bottom:26px;flex-wrap:wrap}.page-title h1{font-size:30px;letter-spacing:-1px;margin:0 0 8px;font-weight:820}.page-title p{color:#8592a2;margin:0;font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:12px 16px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:760;font-size:12px}.btn.primary{background:#168270;color:white;box-shadow:0 8px 20px #16827020}.btn.primary:hover{background:#116e5f}.btn.light{background:white;border:1px solid #dee6eb;color:#465568}.btn.light:hover{background:#f8fafb}.btn.danger{background:#fff1f1;border:1px solid #f5dada;color:#b54343}.btn.sm{padding:8px 10px;font-size:11px;border-radius:8px}.hero{background:#e7f3eb;border-radius:19px;padding:29px 34px;position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:23px;border:1px solid #d8e8db}.hero:after{content:"";position:absolute;width:210px;height:210px;border:42px solid #d6e9d9;border-radius:50%;right:55px;top:-95px;opacity:.6}.hero>*{position:relative;z-index:1}.hero .kicker{color:#4a886e;font-weight:800;letter-spacing:1.25px;font-size:10px}.hero h2{font-size:23px;letter-spacing:-.7px;margin:9px 0}.hero p{color:#6b8579;line-height:1.6;margin:0;max-width:580px}.hero-symbol{font-size:68px;color:#388f77;padding-right:65px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 10px 30px #152b3a08}.stat{padding:21px 21px 19px}.stat-top{display:flex;align-items:center;justify-content:space-between;color:#8994a5;font-size:12px;font-weight:650}.stat-top i{font-size:21px;font-style:normal;background:#eef8f2;border-radius:10px;padding:9px}.stat .value{font-size:32px;font-weight:800;letter-spacing:-1.4px;margin:14px 0 5px}.stat .foot{font-size:11px;color:#8b99a6}.columns{display:grid;grid-template-columns:1.45fr 1fr;gap:20px}.card{padding:23px;min-width:0}.card-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.card-title h3{font-size:17px;margin:0;letter-spacing:-.45px}.card-title span{font-size:11px;color:#8a98aa}.tablewrap{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;white-space:nowrap}.tbl th{color:#8a95a5;font-size:10px;text-transform:uppercase;letter-spacing:.9px;text-align:left;padding:13px 12px;background:#f9fbfc;border-bottom:1px solid #edf0f4}.tbl td{padding:13px 12px;border-bottom:1px solid #eff2f4;color:#48566b;font-size:12px}.tbl td strong{color:#20314b}.tbl tr:last-child td{border-bottom:0}.pill{display:inline-block;border-radius:7px;font-size:10px;padding:6px 9px;font-weight:780;background:#f2f4f8;color:#516075}.pill.completed{background:#e8f6ee;color:#277a51}.pill.scheduled{background:#e8f1fc;color:#3370a4}.pill.cancelled{background:#fff1ee;color:#b2634a}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{border:1px solid #e5ecee;border-radius:10px;background:#fbfdfc;text-align:left;padding:17px;font-size:12px;font-weight:800;color:#3d5b55;cursor:pointer}.quick button:hover{border-color:#91c2b3;background:#f0faf5}.quick button i{display:block;font-style:normal;font-size:23px;margin-bottom:10px}.note{font-size:11px;color:#8593a4;line-height:1.7;margin:14px 0 0}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px;flex-wrap:wrap}.search{width:min(100%,350px);border:1px solid #e1e8ee;background:#fff;border-radius:10px;padding:11px 15px;color:#24344a;outline-offset:3px}.subtle{color:#8290a0;font-size:12px}.blank{padding:60px 20px;text-align:center;color:#8a98aa;line-height:1.7}.blank b{display:block;color:#304155;font-size:16px;margin-bottom:6px}.reportgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.reportgrid .card:first-child{grid-column:1/-1}.datatip{background:#eef8f3;border:1px solid #d5ecdf;padding:13px 16px;border-radius:10px;color:#4a7564;font-size:12px;line-height:1.6;margin:0 0 18px}.modal{padding:0;border:0;border-radius:17px;box-shadow:0 28px 100px #001a3673;max-width:550px;width:calc(100% - 30px)}.modal::backdrop{background:#0c243c9c}.modalheader{display:flex;justify-content:space-between;align-items:center;padding:24px 25px;border-bottom:1px solid #e9eef1}.modalheader h2{margin:0;font-size:19px}.close{border:0;background:#f3f5f6;border-radius:9px;padding:9px 12px}.formgrid{padding:22px 25px;display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{min-width:0}.field.wide{grid-column:1/-1}.field label{display:block;font-size:11px;font-weight:760;margin-bottom:8px;color:#46576e}.field input,.field select,.field textarea{width:100%;border:1px solid #dce4e9;border-radius:9px;padding:11px 12px;color:#2e4055;background:#fcfdfd;resize:vertical;min-width:0}.field textarea{min-height:85px}.modalfooter{display:flex;justify-content:flex-end;gap:10px;padding:0 25px 24px}.toast{position:fixed;z-index:10;bottom:25px;right:24px;background:#15283c;color:white;border-radius:11px;padding:14px 18px;max-width:360px;box-shadow:0 16px 45px #0920354d;font-size:12px}.logo-link{color:#396a60;font-weight:800;text-decoration:underline}small.caption{display:block;font-size:10px;color:#98a4b0;padding-top:4px} @media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}.content{padding:26px}}@media(max-width:720px){.app{display:block}.side{width:100%;height:auto;position:static;padding:10px;display:block}.brand{padding:7px 10px}.side-label,.side-bottom{display:none}.sidebar-nav{display:flex;overflow-x:auto;gap:6px}.navbtn{flex:0 0 auto;width:auto;padding:10px;font-size:11px}.navbtn .ico{display:none}.top{padding:0 18px;height:60px}.content{padding:18px}.hero{padding:23px}.hero-symbol{display:none}.stats{gap:10px}.stat{padding:16px}.reportgrid{grid-template-columns:1fr}.reportgrid .card:first-child{grid-column:auto}.card{padding:16px}.formgrid{grid-template-columns:1fr}.field.wide{grid-column:auto}.page-title h1{font-size:25px}}

<body>
<div class="app">
<aside class="side"><div class="brand"><div class="logo">✚</div><div><strong>CareFlow</strong><small>HOSPITAL SYSTEM</small></div></div><div class="side-label">WORKSPACE</div><nav class="sidebar-nav" id="navigation" aria-label="Application navigation">
<button class="navbtn active" data-view="overview"><span class="ico">▦</span> Overview</button>
<button class="navbtn" data-view="patients"><span class="ico">♙</span> Patients</button>
<button class="navbtn" data-view="doctors"><span class="ico">♧</span> Doctors</button>
<button class="navbtn" data-view="appointments"><span class="ico">▣</span> Appointments</button>
<button class="navbtn" data-view="medical_records"><span class="ico">✎</span> Medical records</button>
<button class="navbtn" data-view="departments"><span class="ico">▤</span> Departments</button>
<button class="navbtn" data-view="insights"><span class="ico">◫</span> Operations studio</button>
<button class="navbtn" data-view="journey"><span class="ico">◎</span> Patient journeys</button>
<button class="navbtn" data-view="reports"><span class="ico">▥</span> Data reports</button>
</nav><div class="side-bottom"><strong>Designed for clarity ✦</strong><p>Five connected entities. Simple workflows. A real MySQL option on localhost.</p></div></aside>
<div class="main"><header class="top"><div class="crumb">Workspace <span aria-hidden="true"> / </span> <b id="crumb">Overview</b></div><div class="top-right"><span class="status" id="mode">● Checking mode</span><span class="avatar" aria-label="CareFlow demo account">CF</span></div></header><main class="content"><section class="page-title"><div><h1 id="pageTitle">Hospital overview</h1><p id="pageDesc">A clearer view of your hospital, all in one place.</p></div><div class="actions" id="pageActions"></div></section><div id="content" aria-live="polite"></div></main></div></div>
<dialog class="modal" id="editor"><form id="entityForm"><div class="modalheader"><h2 id="modalTitle">Add record</h2><button type="button" class="close" id="closeModal" aria-label="Close">✕</button></div><div class="formgrid" id="formFields"></div><div class="modalfooter"><button type="button" class="btn light" id="cancelModal">Cancel</button><button type="submit" class="btn primary" id="submitForm">Save record</button></div></form></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script>
"use strict";
(function(){
const KEY="careflow.demo.v1",entities=["departments","doctors","patients","appointments","medical_records"];
const schema={
 departments:{pk:"department_id",title:"Departments",desc:"Organize clinical departments and their locations.",fields:[["department_name","Department name","text"],["location","Location","text"]],columns:["department_name","location"]},
 doctors:{pk:"doctor_id",title:"Doctors",desc:"Manage doctors, specializations and assigned departments.",fields:[["doctor_name","Doctor name","text"],["specialization","Specialization","text"],["department_id","Department","ref:departments"]],columns:["doctor_name","specialization","department_id"]},
 patients:{pk:"patient_id",title:"Patients",desc:"Register, find and manage patient information.",fields:[["patient_name","Patient name","text"],["age","Age","number"],["gender","Gender","choice:Female|Male|Other|Prefer not to say"],["phone","Phone","tel"]],columns:["patient_name","age","gender","phone"]},
 appointments:{pk:"appointment_id",title:"Appointments",desc:"Schedule consultations and track appointment status.",fields:[["patient_id","Patient","ref:patients"],["doctor_id","Doctor","ref:doctors"],["appointment_date","Date and time","datetime-local"],["status","Status","choice:Scheduled|Completed|Cancelled"]],columns:["patient_id","doctor_id","appointment_date","status"]},
 medical_records:{pk:"record_id",title:"Medical records",desc:"Track diagnoses and treatment linked to patients and doctors.",fields:[["patient_id","Patient","ref:patients"],["doctor_id","Doctor","ref:doctors"],["diagnosis","Diagnosis","textarea"],["treatment","Treatment","textarea"]],columns:["patient_id","doctor_id","diagnosis","treatment"]}
};
const seeds={
 departments:[{department_id:1,department_name:"Cardiology",location:"Block A · Floor 2"},{department_id:2,department_name:"Neurology",location:"Block B · Floor 1"},{department_id:3,department_name:"General Medicine",location:"Block A · Ground"}],
 doctors:[{doctor_id:1,doctor_name:"Dr. Arjun Mehta",specialization:"Cardiologist",department_id:1},{doctor_id:2,doctor_name:"Dr. Nisha Rao",specialization:"Neurologist",department_id:2},{doctor_id:3,doctor_name:"Dr. Priya Shah",specialization:"Physician",department_id:3}],
 patients:[{patient_id:1,patient_name:"Demo Patient A",age:30,gender:"Female",phone:"9000000001"},{patient_id:2,patient_name:"Demo Patient B",age:45,gender:"Male",phone:"9000000002"},{patient_id:3,patient_name:"Demo Patient C",age:27,gender:"Other",phone:"9000000003"}],
 appointments:[{appointment_id:1,patient_id:1,doctor_id:1,appointment_date:"2026-11-02T09:30",status:"Scheduled"},{appointment_id:2,patient_id:2,doctor_id:2,appointment_date:"2026-11-03T11:00",status:"Scheduled"},{appointment_id:3,patient_id:1,doctor_id:3,appointment_date:"2026-10-30T15:00",status:"Completed"}],
 medical_records:[{record_id:1,patient_id:1,doctor_id:3,diagnosis:"Routine follow-up (demo)",treatment:"General wellness advice (demo)"}]
};
function demoDate(day,hour,minute){const d=new Date();d.setDate(d.getDate()+day);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+"T"+String(hour).padStart(2,"0")+":"+String(minute).padStart(2,"0")}
seeds.appointments[0].appointment_date=demoDate(1,9,30);
seeds.appointments[1].appointment_date=demoDate(2,11,0);
seeds.appointments[2].appointment_date=demoDate(-2,15,0);
let data=copy(seeds),mode="demo",view="overview",query="",editId=null,editEntity=null,sqlReports=null;
const $=id=>document.getElementById(id),safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function copy(x){return JSON.parse(JSON.stringify(x))}
function toast(msg){const e=$("toast");e.textContent=msg;e.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.hidden=true,4000)}
function demoSave(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast("Browser storage is unavailable; changes may be temporary.")}}
function validStored(x){return x&&typeof x==="object"&&entities.every(e=>Array.isArray(x[e]));}
function titleCase(s){return s.replace(/_/g," ").replace(/^./,x=>x.toUpperCase())}
function human(entity,row){if(!row)return "Unknown";return row[{departments:"department_name",doctors:"doctor_name",patients:"patient_name"}[entity]]||"Unknown"}
function find(entity,id){return data[entity].find(x=>Number(x[schema[entity].pk])===Number(id))}
function foreign(field,id){let e=field==="department_id"?"departments":field==="doctor_id"?"doctors":"patients";return human(e,find(e,id))}
function display(field,val){if(field.endsWith("_id")&&field!=="record_id"&&field!=="appointment_id")return safe(foreign(field,val));if(field==="appointment_date")return safe(String(val||"").replace("T"," · "));if(field==="status")return '<span class="pill '+safe(String(val).toLowerCase())+'">'+safe(val)+'</span>';return safe(val)}
function actions(){if(entities.includes(view)){return '<button class="btn light" data-action="export">↓ Export JSON</button><button class="btn primary" data-action="new" data-entity="'+view+'">＋ Add '+schema[view].title.toLowerCase().replace(/s$/,"")+'</button>'}if(view==="overview")return '<button class="btn primary" data-action="new" data-entity="appointments">＋ New appointment</button>';if(view==="reports")return '<button class="btn light" data-action="refresh">↻ Refresh reports</button>';return ""}
function render(){if(view==="insights"||view==="journey"){window.CareFlowStudio.render(view);return;}const label=view==="overview"?"Overview":view==="reports"?"SQL reports":schema[view].title;$("crumb").textContent=label;$("pageTitle").textContent=view==="overview"?"Hospital overview":view==="reports"?"Hospital reports":label;$("pageDesc").textContent=view==="overview"?"A clearer view of your hospital, all in one place.":view==="reports"?"Relational JOIN, GROUP BY and subquery-based insights.":schema[view].desc;$("pageActions").innerHTML=actions();document.querySelectorAll("[data-view]").forEach(n=>n.classList.toggle("active",n.dataset.view===view));if(view==="overview")overview();else if(view==="reports")renderReports();else listing();}
function stat(label,value,icon,foot){return '<div class="stat"><div class="stat-top"><span>'+safe(label)+'</span><i>'+icon+'</i></div><div class="value">'+safe(value)+'</div><div class="foot">'+safe(foot)+'</div></div>'}
function table(entity,items,editable){const s=schema[entity],head=s.columns.map(c=>'<th>'+safe(s.fields.find(f=>f[0]===c)?.[1]||titleCase(c))+'</th>').join("");const rows=items.map(row=>'<tr>'+s.columns.map(c=>'<td>'+display(c,row[c])+'</td>').join("")+(editable?'<td><button class="btn light sm" data-action="edit" data-entity="'+entity+'" data-id="'+row[s.pk]+'">Edit</button> <button class="btn danger sm" data-action="delete" data-entity="'+entity+'" data-id="'+row[s.pk]+'">Delete</button></td>':"")+'</tr>').join("");return '<div class="tablewrap"><table class="tbl"><thead><tr>'+head+(editable?"<th>Actions</th>":"")+'</tr></thead><tbody>'+rows+'</tbody></table></div>'}
function overview(){const upcoming=data.appointments.slice().sort((a,b)=>a.appointment_date.localeCompare(b.appointment_date)).filter(x=>x.status==="Scheduled").slice(0,5);$("content").innerHTML='<div class="hero"><div><div class="kicker">WELCOME TO YOUR WORKSPACE</div><h2>Better coordination. Better care.</h2><p>A clean place to manage the essentials: people, schedules, clinical records and departments.</p></div><div class="hero-symbol" aria-hidden="true">✚</div></div><div class="stats">'+stat("Total patients",data.patients.length,"♙","Registered patient profiles")+stat("Doctors",data.doctors.length,"♧","Across "+data.departments.length+" departments")+stat("Appointments",data.appointments.length,"▣","All appointment records")+stat("Medical records",data.medical_records.length,"✎","Connected clinical notes")+'</div><div class="columns"><section class="card"><div class="card-title"><h3>Upcoming appointments</h3><span>Scheduled consultations</span></div>'+(upcoming.length?'<div class="tablewrap"><table class="tbl"><thead><tr><th>Patient</th><th>Doctor</th><th>Date & time</th><th>Status</th></tr></thead><tbody>'+upcoming.map(a=>'<tr><td><strong>'+safe(foreign("patient_id",a.patient_id))+'</strong></td><td>'+safe(foreign("doctor_id",a.doctor_id))+'</td><td>'+display("appointment_date",a.appointment_date)+'</td><td>'+display("status",a.status)+'</td></tr>').join("")+'</tbody></table></div>':'<div class="blank">No scheduled appointments yet.</div>')+'</section><section class="card"><div class="card-title"><h3>Quick actions</h3><span>Common tasks</span></div><div class="quick"><button data-action="new" data-entity="patients"><i>♙</i>Add patient</button><button data-action="new" data-entity="doctors"><i>♧</i>Add doctor</button><button data-action="new" data-entity="appointments"><i>▣</i>Book appointment</button><button data-action="new" data-entity="medical_records"><i>✎</i>Add medical record</button></div><p class="note" id="dataHint"></p></section></div>';$("dataHint").textContent="FICTIONAL DEMO ONLY: This is a browser-based portfolio experience, not a real hospital. Changes stay on this device.";}
function listing(){let e=view,s=schema[e],q=query.toLowerCase(),items=data[e].filter(row=>Object.entries(row).some(([k,v])=>String(v??"").toLowerCase().includes(q))||s.columns.some(c=>c.endsWith("_id")&&foreign(c,row[c]).toLowerCase().includes(q)));$("content").innerHTML='<section class="card"><div class="toolbar"><input id="search" class="search" type="search" placeholder="Search '+safe(s.title.toLowerCase())+' by name or ID..." value="'+safe(query)+'" aria-label="Search records"><span class="subtle">'+items.length+' record'+(items.length===1?"":"s")+'</span></div>'+(items.length?table(e,items,true):'<div class="blank"><b>No matching records</b>Try a different search or add a new record.</div>')+'</section>';$("search").addEventListener("input",e=>{query=e.target.value;const pos=e.target.selectionStart;listing();let input=$("search");input.focus();try{input.setSelectionRange(pos,pos)}catch(_){}})}
function reportData(){let joined=data.appointments.map(a=>({...a,patient_name:foreign("patient_id",a.patient_id),doctor_name:foreign("doctor_id",a.doctor_id),department_name:foreign("department_id",find("doctors",a.doctor_id)?.department_id)}));let workload=data.doctors.map(d=>({doctor_name:d.doctor_name,appointment_count:data.appointments.filter(a=>a.doctor_id===d.doctor_id).length})).sort((a,b)=>b.appointment_count-a.appointment_count);let repeat=data.patients.filter(p=>data.appointments.filter(a=>a.patient_id===p.patient_id).length>1);return {appointments:joined,doctor_workload:workload,repeat_patients:repeat}}
function renderReports(){const r=sqlReports||reportData();let details=r.appointments||[];$("content").innerHTML='<div class="datatip">'+"In-browser relationship reports inspired by SQL JOIN, GROUP BY and a correlated subquery; no SQL database is connected."+'</div><div class="reportgrid"><section class="card"><div class="card-title"><h3>Appointment details · JOIN</h3><span>Patients × Doctors × Departments</span></div>'+(details.length?'<div class="tablewrap"><table class="tbl"><thead><tr><th>Patient</th><th>Doctor</th><th>Department</th><th>Date</th></tr></thead><tbody>'+details.slice(0,100).map(x=>'<tr><td>'+safe(x.patient_name)+'</td><td>'+safe(x.doctor_name)+'</td><td>'+safe(x.department_name)+'</td><td>'+display("appointment_date",x.appointment_date)+'</td></tr>').join("")+'</tbody></table></div>':'<div class="blank">No appointments.</div>')+'</section><section class="card"><div class="card-title"><h3>Doctor workload · GROUP BY</h3></div>'+(r.doctor_workload?.length?'<div class="tablewrap"><table class="tbl"><thead><tr><th>Doctor</th><th>Appointments</th></tr></thead><tbody>'+r.doctor_workload.map(x=>'<tr><td>'+safe(x.doctor_name)+'</td><td>'+safe(x.appointment_count)+'</td></tr>').join("")+'</tbody></table></div>':'<div class="blank">No doctors.</div>')+'</section><section class="card"><div class="card-title"><h3>Returning patients · Subquery</h3></div>'+(r.repeat_patients?.length?r.repeat_patients.map(p=>'<p>♙ '+safe(p.patient_name)+'</p>').join(""):'<div class="blank">No patients have multiple appointments.</div>')+'</section></div>';}
function formOpen(e,id=null){if(!schema[e])return;const s=schema[e],row=id===null?null:find(e,id);if(id!==null&&!row)return toast("Record not found.");editEntity=e;editId=id;$("modalTitle").textContent=(row?"Edit ":"Add ")+s.title.replace(/s$/,"");let html="";for(const [k,label,type] of s.fields){let val=String(row?.[k]??(k==="status"?"Scheduled":""));let ctrl="";if(type.startsWith("ref:")){const target=type.split(":")[1],opts=data[target];if(!opts.length){toast("Please add a "+target.replace(/s$/,"")+" before creating this record.");return;}ctrl='<select required name="'+k+'"><option value="">Select '+safe(label)+'</option>'+opts.map(x=>'<option value="'+x[schema[target].pk]+'" '+(String(x[schema[target].pk])===val?"selected":"")+'>'+safe(human(target,x))+'</option>').join("")+'</select>';}else if(type.startsWith("choice:")){const options=type.slice(7).split("|");ctrl='<select required name="'+k+'"><option value="">Select '+safe(label)+'</option>'+options.map(opt=>'<option value="'+safe(opt)+'" '+(val===opt?"selected":"")+'>'+safe(opt)+'</option>').join("")+'</select>';}else if(type==="textarea"){ctrl='<textarea required maxlength="5000" name="'+k+'">'+safe(val)+'</textarea>';}else{const extra=type==="number"?'min="0" max="120" step="1"':type==="tel"?'pattern="[+0-9 ()-]{7,20}" maxlength="20"':type==="text"?'maxlength="120"':"";ctrl='<input required name="'+k+'" type="'+type+'" value="'+safe(val)+'" '+extra+' />';}html+='<div class="field '+(type==="textarea"?"wide":"")+'"><label for="field_'+k+'">'+safe(label)+'</label>'+ctrl+'</div>';}
$("formFields").innerHTML=html+(e==="appointments"?'<div id="slotHint" class="slot-hint" role="status">Select a doctor, patient, and appointment time to check whether this demo slot is available.</div>':"");for(const input of $("formFields").querySelectorAll("input,select,textarea"))input.id="field_"+input.name;$("editor").showModal();}
function demoValidate(e,values,id){if(e==="appointments"&&values.status==="Scheduled"){const collisions=data.appointments.filter(a=>a.status==="Scheduled"&&a.appointment_date===values.appointment_date&&Number(a.appointment_id)!==Number(id));if(collisions.some(a=>Number(a.doctor_id)===Number(values.doctor_id)))throw Error("Doctor is already booked for that time. Select another slot.");if(collisions.some(a=>Number(a.patient_id)===Number(values.patient_id)))throw Error("Patient already has an appointment at that time.");}if(e==="patients"){const age=Number(values.age);if(!Number.isInteger(age)||age<0||age>120)throw Error("Age must be between 0 and 120.");if(!/^[+0-9 ()-]{7,20}$/.test(values.phone))throw Error("Invalid phone number.");}for(const k of ["patient_id","doctor_id","department_id"]){if(k in values){const target=k==="patient_id"?"patients":k==="doctor_id"?"doctors":"departments";if(!find(target,values[k]))throw Error("Select an existing "+target.slice(0,-1)+".");}}if(e==="departments"&&data.departments.some(d=>d.department_name.toLowerCase()===values.department_name.toLowerCase()&&d.department_id!==id))throw Error("Department name must be unique.");}
async function submit(ev){
 ev.preventDefault();if(!editEntity)return;
 const e=editEntity,s=schema[e],id=editId,form=new FormData($("entityForm")),values={};
 for(const [k,_,type] of s.fields){values[k]=form.get(k)?.toString().trim()||"";if(!values[k])return toast("Complete all required fields.");if(type==="number"||type.startsWith("ref:"))values[k]=Number(values[k]);}
 $("submitForm").disabled=true;
 try{
   demoValidate(e,values,id);
   if(id===null){const next=Math.max(0,...data[e].map(row=>Number(row[s.pk])))+1;data[e].push({[s.pk]:next,...values});}
   else {const row=find(e,id);Object.assign(row,values);}
   demoSave();sqlReports=null;$("editor").close();render();toast(id===null?"Demo record created.":"Demo changes saved.");
 }catch(err){toast(err.message)}
 finally{$("submitForm").disabled=false}
}
async function remove(e,id){
 const row=find(e,id);if(!row)return;
 if(!confirm("Delete this fictional "+e.replace(/_/g," ").slice(0,-1)+"? Linked records may prevent deletion."))return;
 try{
   const linked={departments:["doctors","department_id"],doctors:["appointments","doctor_id","medical_records","doctor_id"],patients:["appointments","patient_id","medical_records","patient_id"]}[e];
   if(linked)for(let j=0;j<linked.length;j+=2)if(data[linked[j]].some(x=>Number(x[linked[j+1]])===Number(id)))throw Error("Cannot delete this record because another record references it.");
   data[e]=data[e].filter(x=>Number(x[schema[e].pk])!==Number(id));demoSave();sqlReports=null;render();toast("Demo record deleted.");
 }catch(err){toast(err.message)}
}
function exportData(){if(!confirm("Export current records to a JSON file on this device? Avoid sharing real patient information."))return;const blob=new Blob([JSON.stringify({created_at:new Date().toISOString(),mode,data},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="careflow-hospital-data.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function refreshReports(){sqlReports=null;render();}
function navigate(v){if(!["overview","insights","journey","reports",...entities].includes(v))return;view=v;query="";sqlReports=null;render();}
document.addEventListener("click",ev=>{const v=ev.target.closest("[data-view]");if(v)return navigate(v.dataset.view);const a=ev.target.closest("[data-action]");if(!a)return;const action=a.dataset.action,e=a.dataset.entity,id=Number(a.dataset.id);if(action==="new")formOpen(e);if(action==="edit")formOpen(e,id);if(action==="delete")remove(e,id);if(action==="export")exportData();if(action==="refresh")refreshReports();});
$("entityForm").addEventListener("submit",submit);$("closeModal").addEventListener("click",()=>$("editor").close());$("cancelModal").addEventListener("click",()=>$("editor").close());
async function start(){try{const stored=JSON.parse(localStorage.getItem(KEY)||"null");if(validStored(stored))data=stored;}catch(err){console.warn("Local demo data unavailable",err)}$("mode").textContent="● Browser demo · fictitious data";$("mode").className="status";render()}
window.CareFlow={getData:()=>data,getView:()=>view,getEditId:()=>editId,getDemoSeed:()=>copy(seeds),resetDemo:()=>{data=copy(seeds);demoSave();render()},notify:toast,navigate};
start();
})();
